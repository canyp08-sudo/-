const key='clinical-equipment-v1'; let db; try{db=JSON.parse(localStorage.getItem(key))||{items:seed,loans:[]}}catch(e){alert('無法讀取既有資料，請先檢查瀏覽器儲存空間。');throw e} let tab='inventory'; const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const remaining=l=>l.qty-l.returns.reduce((s,r)=>s+r.qty,0);const borrowed=id=>db.loans.filter(l=>l.itemId===id).reduce((s,l)=>s+remaining(l),0);const save=()=>{try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('儲存失敗，請確認瀏覽器允許儲存資料。');return false}};const item=id=>db.items.find(i=>i.id===id);const dialog=$('#dialog');function close(){dialog.close()}function show(html){$('#modal').innerHTML=html;dialog.showModal();$('#cancel').onclick=close}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function render(){let active=db.loans.filter(l=>remaining(l)>0), overdue=active.filter(l=>l.due&&l.due<today());$('#stats').innerHTML=[['教具種類',db.items.length],['教具總數',db.items.reduce((a,i)=>a+i.total,0)],['借出中',active.reduce((a,l)=>a+remaining(l),0)],['逾期筆數',overdue.length]].map(([a,b])=>`<div class="card"><span>${a}</span><strong>${b}</strong></div>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let q=$('#search').value.trim().toLowerCase(), matches=(...v)=>v.join(' ').toLowerCase().includes(q);if(tab==='inventory'){let rows=db.items.filter(i=>matches(i.id,i.name,i.brand,i.model));$('#hint').textContent=`顯示 ${rows.length} 種教具`;$('#content').innerHTML=rows.length?`<table><thead><tr><th>編號</th><th>照片</th><th>教具名稱</th><th>廠牌 / 型號</th><th>可借 / 總數</th><th>操作</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${esc(i.id)}</td><td>${Number.isInteger(Number(i.id)) && String(Number(i.id))===i.id && Number(i.id)>=1 && Number(i.id)<=photos.length ? `<img class="equipment-photo" src="${photos[Number(i.id)-1]}" alt="${esc(i.name)}的照片">` : `<span class="photo-placeholder">無照片</span>`}</td><td><b>${esc(i.name)}</b></td><td>${esc(i.brand||'—')}<small>${esc(i.model||'')}</small></td><td><span class="badge ${i.total-borrowed(i.id)<=0?'warn':''}">${i.total-borrowed(i.id)} / ${i.total}</span></td><td><button data-loan="${esc(i.id)}" ${i.total-borrowed(i.id)<=0?'disabled':''}>借出</button> <button data-edit="${esc(i.id)}">編輯</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">找不到符合的教具</div>'}else{let rows=(tab==='loans'?active:db.loans).slice().reverse().filter(l=>matches(l.name,l.itemId,l.borrower,l.unit,l.note));$('#hint').textContent=`${rows.length} 筆紀錄`;$('#content').innerHTML=rows.length?`<table><thead><tr><th>教具 / 借用人</th><th>借出日期</th><th>預計歸還</th><th>數量</th><th>狀態 / 操作</th></tr></thead><tbody>${rows.map(l=>{let left=remaining(l),late=left>0&&l.due&&l.due<today();return `<tr><td><b>${esc(l.name)}</b><small>${esc(l.borrower)}${l.unit?' · '+esc(l.unit):''}${l.note?' · '+esc(l.note):''}</small></td><td>${esc(l.date)}</td><td class="${late?'overdue':''}">${esc(l.due||'—')}${late?'（逾期）':''}</td><td>借出 ${l.qty}<small>未還 ${left}</small></td><td>${left?`<button data-return="${esc(l.id)}">辦理歸還</button>`:`<span class="badge">已全數歸還</span>`}<small>${l.returns.map(r=>`${esc(r.date)} 歸還 ${r.qty}`).join('；')}</small></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">目前沒有符合的紀錄</div>'}}
function edit(id){let i=id?item(id):{id:'',name:'',total:1,brand:'',model:''};show(`<h2>${id?'編輯教具':'新增教具'}</h2><p class="muted">總數不可小於目前借出的數量。</p><form id="form"><label>教具編號<input name="id" required value="${esc(i.id)}" ${id?'readonly':''}></label><label>教具名稱<input name="name" required value="${esc(i.name)}"></label><div class="row"><label>總數<input type="number" name="total" min="${id?Math.max(0,borrowed(id)):1}" required value="${i.total}"></label><label>廠牌<input name="brand" value="${esc(i.brand)}"></label></div><label>規格 / 型號<input name="model" value="${esc(i.model)}"></label><footer><button type="button" id="cancel">取消</button><button class="primary">儲存</button></footer></form>`);$('#form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n={id:f.get('id').trim(),name:f.get('name').trim(),total:Number(f.get('total')),brand:f.get('brand').trim(),model:f.get('model').trim()};if(!n.id||!n.name||!Number.isInteger(n.total)||n.total<(id?borrowed(id):1)){alert('請檢查編號、名稱與數量。');return}if(!id&&item(n.id)){alert('教具編號已存在。');return}if(id)Object.assign(i,n);else db.items.push(n);if(save()){close();render()}}}
function loan(id){let i=item(id),available=i.total-borrowed(id);show(`<h2>借出教具</h2><div class="notice">${esc(i.name)} · 目前可借 ${available} 件</div><form id="form"><label>借用人<input name="borrower" required maxlength="100"></label><label>單位 / 聯絡方式<input name="unit" maxlength="150"></label><div class="row"><label>借出數量<input name="qty" type="number" min="1" max="${available}" value="1" required></label><label>借出日期<input type="date" name="date" value="${today()}" required></label></div><label>預計歸還日期<input type="date" name="due"></label><label>備註<textarea name="note" rows="2" maxlength="500"></textarea></label><footer><button type="button" id="cancel">取消</button><button class="primary">確認借出</button></footer></form>`);$('#form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),qty=Number(f.get('qty')),date=f.get('date'),due=f.get('due');if(!f.get('borrower').trim()||!Number.isInteger(qty)||qty<1||qty>i.total-borrowed(id)||due&&due<date){alert('請確認借用人、數量與日期；預計歸還日不能早於借出日。');return}db.loans.push({id:uid(),itemId:id,name:i.name,borrower:f.get('borrower').trim(),unit:f.get('unit').trim(),qty,date,due,note:f.get('note').trim(),returns:[]});if(save()){close();render()}}}
function returnLoan(id){let l=db.loans.find(x=>x.id===id),left=remaining(l);show(`<h2>辦理歸還</h2><div class="notice">${esc(l.name)}<br>${esc(l.borrower)} · 尚未歸還 ${left} 件</div><form id="form"><label>歸還數量<input name="qty" type="number" min="1" max="${left}" value="${left}" required></label><label>歸還日期<input name="date" type="date" min="${esc(l.date)}" value="${today()}" required></label><footer><button type="button" id="cancel">取消</button><button class="primary">確認歸還</button></footer></form>`);$('#form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),qty=Number(f.get('qty')),date=f.get('date');if(!Number.isInteger(qty)||qty<1||qty>remaining(l)||date<l.date){alert('請檢查歸還數量及日期。');return}l.returns.push({qty,date});if(save()){close();render()}}}
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.loan)loan(b.dataset.loan);if(b.dataset.edit)edit(b.dataset.edit);if(b.dataset.return)returnLoan(b.dataset.return)});$('#add').onclick=()=>edit();$('#search').oninput=render;$('#backup').onclick=()=>download(`教具借還備份-${today()}.json`,JSON.stringify({version:1,...db},null,2),'application/json');$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==1||!Array.isArray(x.items)||!Array.isArray(x.loans)||x.items.some(i=>!i.id||!i.name||!Number.isInteger(i.total)||i.total<0)||new Set(x.items.map(i=>i.id)).size!==x.items.length||x.loans.some(l=>!l.id||!x.items.some(i=>i.id===l.itemId)||!Number.isInteger(l.qty)||l.qty<1||!Array.isArray(l.returns)||l.returns.some(r=>!Number.isInteger(r.qty)||r.qty<1)||remaining(l)<0)||x.items.some(i=>x.loans.filter(l=>l.itemId===i.id).reduce((n,l)=>n+remaining(l),0)>i.total))throw Error();if(confirm('還原會取代目前所有教具與借還紀錄。建議先備份目前資料。確定繼續？')){db={items:x.items,loans:x.loans};if(save())render()}}catch(err){alert('備份檔案格式不正確，無法還原。')}e.target.value=''};$('#exportCsv').onclick=()=>{let lines=[['教具編號','教具名稱','借用人','單位 / 聯絡方式','借出日期','預計歸還日期','借出數量','未還數量','歸還明細','備註'],...db.loans.map(l=>[l.itemId,l.name,l.borrower,l.unit,l.date,l.due,l.qty,remaining(l),l.returns.map(r=>`${r.date}：${r.qty}`).join('；'),l.note])];download(`教具借還紀錄-${today()}.csv`,'\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};render();
